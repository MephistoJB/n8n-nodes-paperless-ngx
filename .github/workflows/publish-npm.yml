name: Publish to npm

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up npm for trusted publishing
        run: npm install --global "npm@^11.5.1"

      - name: Verify release version
        if: github.event_name == 'release'
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$release_version" ]; then
            echo "package.json version ($package_version) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Prepare package version
        id: version
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "release" ]; then
              echo "${package_name}@${package_version} is already published; skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            npm version patch --no-git-tag-version
            package_version="$(node -p "require('./package.json').version")"
            echo "Bumped package version to ${package_version}."
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Type check
        if: steps.version.outputs.publish == 'true'
        run: pnpm exec tsc --noEmit

      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public

      - name: Commit automatic version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Bump package version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main
