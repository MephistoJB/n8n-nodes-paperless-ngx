name: Publish to npm

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up npm for trusted publishing
        run: npm install --global "npm@^11.5.1"

      - name: Verify release version
        if: github.event_name == 'release'
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$release_version" ]; then
            echo "package.json version ($package_version) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Check whether package version is already published
        id: package
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Type check
        if: steps.package.outputs.published == 'false'
        run: pnpm exec tsc --noEmit

      - name: Publish package
        if: steps.package.outputs.published == 'false'
        run: npm publish --access public
